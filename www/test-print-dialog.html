<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="base-path" content="">
    <title>Print Dialog Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light p-4">
    <div class="container">
        <h1>Print Dialog Diagnostic</h1>

        <div class="card bg-secondary text-light mt-4">
            <div class="card-header">
                <h3>System Checks</h3>
            </div>
            <div class="card-body">
                <div id="diagnostics">
                    <p>Running diagnostics...</p>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary" id="testPrintBtn">Test Print Dialog</button>
            <button class="btn btn-success" id="loadPrintersBtn">Load Printers</button>
        </div>

        <div class="card bg-secondary text-light mt-4">
            <div class="card-header">
                <h3>Results</h3>
            </div>
            <div class="card-body">
                <pre id="results" class="text-light"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.DICOM_VIEWER = window.DICOM_VIEWER || {};

        async function runDiagnostics() {
            const results = [];
            const diagnosticsDiv = document.getElementById('diagnostics');

            // Check 1: Electron API
            results.push(`✓ Electron API available: ${!!(window.electronAPI && window.electronAPI.isElectron)}`);

            // Check 2: DICOM_VIEWER object
            results.push(`✓ DICOM_VIEWER exists: ${!!window.DICOM_VIEWER}`);

            // Wait for custom print dialog script to load
            await new Promise(resolve => setTimeout(resolve, 1000));

            // Check 3: CustomPrintDialog class
            results.push(`✓ CustomPrintDialog class exists: ${!!window.DICOM_VIEWER.CustomPrintDialog}`);

            // Check 4: customPrintDialog instance
            results.push(`✓ customPrintDialog instance exists: ${!!window.DICOM_VIEWER.customPrintDialog}`);

            if (window.DICOM_VIEWER.customPrintDialog) {
                results.push(`✓ customPrintDialog.isAvailable(): ${window.DICOM_VIEWER.customPrintDialog.isAvailable()}`);
            }

            diagnosticsDiv.innerHTML = results.map(r => `<p class="mb-1">${r}</p>`).join('');
        }

        async function testLoadPrinters() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.textContent = 'Loading printers...\n';

            try {
                // Test system printers
                if (window.electronAPI && window.electronAPI.getSystemPrinters) {
                    const systemResult = await window.electronAPI.getSystemPrinters();
                    resultsDiv.textContent += '\n=== SYSTEM PRINTERS ===\n';
                    resultsDiv.textContent += JSON.stringify(systemResult, null, 2) + '\n';
                }

                // Test hospital printers API
                const basePath = document.querySelector('meta[name="base-path"]')?.content || '';
                const response = await fetch(`${basePath}/api/settings/hospital-printers.php`);
                const hospitalResult = await response.json();
                resultsDiv.textContent += '\n=== HOSPITAL PRINTERS API ===\n';
                resultsDiv.textContent += JSON.stringify(hospitalResult, null, 2) + '\n';

                // Test custom print dialog
                if (window.DICOM_VIEWER.customPrintDialog) {
                    await window.DICOM_VIEWER.customPrintDialog.matchPrinters();
                    resultsDiv.textContent += '\n=== CUSTOM PRINT DIALOG STATE ===\n';
                    resultsDiv.textContent += `Hospital Printers: ${window.DICOM_VIEWER.customPrintDialog.hospitalPrinters.length}\n`;
                    resultsDiv.textContent += `System Printers: ${window.DICOM_VIEWER.customPrintDialog.systemPrinters.length}\n`;
                    resultsDiv.textContent += `Matched Printers: ${window.DICOM_VIEWER.customPrintDialog.matchedPrinters.length}\n`;
                    resultsDiv.textContent += JSON.stringify(window.DICOM_VIEWER.customPrintDialog.matchedPrinters, null, 2) + '\n';
                }
            } catch (error) {
                resultsDiv.textContent += '\n=== ERROR ===\n';
                resultsDiv.textContent += error.toString() + '\n' + error.stack;
            }
        }

        async function testPrintDialog() {
            const resultsDiv = document.getElementById('results');

            if (!window.DICOM_VIEWER.customPrintDialog) {
                resultsDiv.textContent = 'ERROR: customPrintDialog not available!';
                return;
            }

            try {
                resultsDiv.textContent = 'Showing print dialog...\n';

                window.DICOM_VIEWER.customPrintDialog.show({
                    printSettings: {},
                    onPrint: async (result) => {
                        resultsDiv.textContent += '\n=== PRINT TRIGGERED ===\n';
                        resultsDiv.textContent += JSON.stringify(result, null, 2) + '\n';
                    },
                    onCancel: () => {
                        resultsDiv.textContent += '\nPrint cancelled\n';
                    }
                });
            } catch (error) {
                resultsDiv.textContent += '\n=== ERROR ===\n';
                resultsDiv.textContent += error.toString() + '\n' + error.stack;
            }
        }

        // Run diagnostics on load
        window.addEventListener('DOMContentLoaded', runDiagnostics);

        // Button handlers
        document.getElementById('loadPrintersBtn').addEventListener('click', testLoadPrinters);
        document.getElementById('testPrintBtn').addEventListener('click', testPrintDialog);
    </script>

    <!-- Load custom print dialog -->
    <script src="js/components/custom-print-dialog.js"></script>
</body>
</html>
